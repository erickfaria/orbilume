name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    name: Build and test plugin
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Get current stable JOSM
        run: curl --fail --location --retry 3 --max-time 180 -o "$RUNNER_TEMP/josm.jar" https://josm.openstreetmap.de/josm-tested.jar
      - name: Build one release JAR and verify packaging
        run: |
          JOSM_JAR="$RUNNER_TEMP/josm.jar" ./build.sh
          jar tf build/orbilume.jar > "$RUNNER_TEMP/orbilume-contents.txt"
          grep -Fx 'org/openstreetmap/josm/plugins/orbilume/OrbilumePlugin.class' "$RUNNER_TEMP/orbilume-contents.txt"
          grep -Fx 'LICENSE' "$RUNNER_TEMP/orbilume-contents.txt"
          grep -Fx 'docs/Sources-and-Licenses.md' "$RUNNER_TEMP/orbilume-contents.txt"
          grep -Fx 'images/orbilume/icon.svg' "$RUNNER_TEMP/orbilume-contents.txt"
      - name: Verify imagery behavior offline
        run: |
          cat > "$RUNNER_TEMP/AuditSmoke.java" <<'JAVA'
          package org.openstreetmap.josm.plugins.orbilume;

          import java.awt.Rectangle;
          import java.awt.image.BufferedImage;
          import java.io.ByteArrayInputStream;
          import java.io.ByteArrayOutputStream;
          import javax.imageio.IIOImage;
          import javax.imageio.ImageIO;
          import javax.imageio.ImageWriteParam;

          class AuditSmoke {
              public static void main(String[] args) throws Exception {
                  var provider = Copernicus.Provider.EOPF;
                  String fixture = """
                          {"type":"FeatureCollection","features":[{
                            "id":"S2A_fixture","collection":"sentinel-2-l2a",
                            "properties":{"datetime":"2026-09-01T10:00:00Z","eo:cloud_cover":12}
                          }]}
                          """;
                  var bounds = Copernicus.parseAoi("16.41,48.195,16.43,48.205");
                  var catalog = new Copernicus(uri -> {
                      if (!uri.getQuery().contains("bbox=16.4100000,48.1950000,16.4300000,48.2050000")) {
                          throw new AssertionError("Search did not send the expected AOI");
                      }
                      return fixture;
                  });
                  var scenes = catalog.search(bounds, java.time.LocalDate.of(2026, 9, 1),
                          java.time.LocalDate.of(2026, 9, 2), 20, provider);
                  if (scenes.size() != 1 || !scenes.get(0).attribution().endsWith("2026")
                          || !Copernicus.parse(fixture.replace("sentinel-2-l2a", "unrelated"), provider).isEmpty()) {
                      throw new AssertionError("Unexpected STAC search, attribution, or collection handling");
                  }
                  try {
                      Copernicus.parse(fixture.replace("S2A_fixture", "../unexpected"), provider);
                      throw new AssertionError("Invalid STAC item ID accepted");
                  } catch (java.io.IOException expected) {
                      // Invalid item IDs must not become imagery requests.
                  }

                  var image = new BufferedImage(32, 32, BufferedImage.TYPE_USHORT_GRAY);
                  for (int y = 0; y < 32; y++) {
                      for (int x = 0; x < 32; x++) {
                          image.getRaster().setSample(x, y, 0, 40_000 + 32 * y + x);
                      }
                  }
                  var bytes = new ByteArrayOutputStream();
                  var writer = ImageIO.getImageWritersByFormatName("TIFF").next();
                  try (var out = ImageIO.createImageOutputStream(bytes)) {
                      writer.setOutput(out);
                      var options = writer.getDefaultWriteParam();
                      options.setCompressionMode(ImageWriteParam.MODE_EXPLICIT);
                      options.setCompressionType("Deflate");
                      options.setTilingMode(ImageWriteParam.MODE_EXPLICIT);
                      options.setTiling(16, 16, 0, 0);
                      writer.write(null, new IIOImage(image, null, null), options);
                  } finally {
                      writer.dispose();
                  }
                  try (var in = ImageIO.createImageInputStream(new ByteArrayInputStream(bytes.toByteArray()))) {
                      var asset = new EarthRaster.Asset(null, 32, 32, 0, 0, 10, 1, 0);
                      var crop = EarthRaster.readBand(in, asset, new Rectangle(14, 14, 6, 5));
                      if (crop.getWidth() != 6 || crop.getHeight() != 5
                              || crop.getSample(0, 0, 0) != 40_462 || crop.getSample(5, 4, 0) != 40_595) {
                          throw new AssertionError("Unexpected samples in 16-bit TIFF crop spanning four tiles");
                      }
                  }
                  System.out.println("Verified simulated STAC search and a tiled TIFF crop.");
              }
          }
          JAVA
          mkdir -p "$RUNNER_TEMP/check-classes"
          javac -cp "$RUNNER_TEMP/josm.jar:build/orbilume.jar" -d "$RUNNER_TEMP/check-classes" "$RUNNER_TEMP/AuditSmoke.java"
          java -Djava.awt.headless=true -cp "$RUNNER_TEMP/josm.jar:build/orbilume.jar:$RUNNER_TEMP/check-classes" \
            org.openstreetmap.josm.plugins.orbilume.AuditSmoke
      - name: Check installation and launch on both JOSM versions
        run: |
          cat > "$RUNNER_TEMP/start-josm" <<'SH'
          #!/bin/bash
          set -euo pipefail
          josm=$1
          plugin=$2
          profile=$(mktemp -d)
          mkdir -p "$profile/prefs" "$profile/data/plugins"
          cp "$plugin" "$profile/data/plugins/orbilume.jar"
          cat > "$profile/prefs/preferences.xml" <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <preferences xmlns="http://josm.openstreetmap.de/preferences-1.0" version="19369">
            <list key="plugins"><entry value="orbilume"/></list>
            <list key="imagery.layers.default"/>
            <tag key="message.sanityCheckFailed" value="false"/>
            <tag key="message.sanityCheckFailed.value" value="2"/>
            <tag key="message.welcome.show" value="false"/>
            <tag key="prefer.ipv6" value="false"/>
            <list key="mappaint.style.known-defaults">
              <entry value="resource://styles/standard/elemstyles.mapcss"/>
            </list>
          </preferences>
          XML
          printf '%s\n' '<osm version="0.6" upload="never"><node id="-1" lat="0" lon="0"/></osm>' > "$profile/map.osm"
          timeout 65s xvfb-run --auto-servernum java -Djosm.pref="$profile/prefs" \
            -Djosm.userdata="$profile/data" -Djosm.cache="$profile/cache" -jar "$josm" \
            --language=en --offline=all "$profile/map.osm" > "$profile/startup.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; rm -rf "$profile"' EXIT
          for attempt in {1..55}; do
            if grep -Eiq "Could not load plugin|Failed to load plugin|PluginException|UnsupportedClassVersionError" "$profile/startup.log"; then
              break
            fi
            if grep -q "loading plugin 'orbilume'" "$profile/startup.log" &&
               grep -Fq "Open file: $profile/map.osm" "$profile/startup.log"; then
              grep "loading plugin 'orbilume'" "$profile/startup.log"
              exit 0
            fi
            kill -0 "$pid" || break
            sleep 1
          done
          cat "$profile/startup.log"
          exit 1
          SH
          bash "$RUNNER_TEMP/start-josm" "$RUNNER_TEMP/josm.jar" "$PWD/build/orbilume.jar"
          docker run --rm -e DEBIAN_FRONTEND=noninteractive \
            -v "$RUNNER_TEMP/start-josm:/start-josm:ro" \
            -v "$PWD/build/orbilume.jar:/orbilume.jar:ro" debian:13-slim bash -euc '
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends josm=0.0.svn19369+dfsg-2 xvfb xauth
              bash /start-josm /usr/share/josm/josm.jar /orbilume.jar
            '
