name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  plugin:
    name: Build and test plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Get JOSM
        run: curl --fail --location --retry 3 --max-time 45 -o "$RUNNER_TEMP/josm.jar" https://josm.openstreetmap.de/josm-tested.jar
      - name: Build the release JAR
        run: JOSM_JAR="$RUNNER_TEMP/josm.jar" ./build.sh
      - name: Verify packaging
        run: |
          jar tf build/orbilume.jar > "$RUNNER_TEMP/orbilume-contents.txt"
          grep -Fx 'org/openstreetmap/josm/plugins/orbilume/OrbilumePlugin.class' "$RUNNER_TEMP/orbilume-contents.txt"
          grep -Fx 'LICENSE' "$RUNNER_TEMP/orbilume-contents.txt"
